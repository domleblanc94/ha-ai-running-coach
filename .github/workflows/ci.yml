name: App checks
on: [push, pull_request]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned official FIT decoder for offline tests
        run: npm install --prefix "${{ runner.temp }}/coach-fit-sdk" --ignore-scripts --no-audit --no-fund @garmin/fitsdk@21.221.0
      - run: python scripts/vendor_core.py
      - run: python -m pip install -r ai_running_coach/core/requirements.txt -r ai_running_coach/app/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python run_offline_tests.py
        working-directory: ai_running_coach/core
        env:
          COACH_TEST_NO_NETWORK: "1"
          COACH_FIT_SDK_MODULE: '${{ runner.temp }}/coach-fit-sdk/node_modules/@garmin/fitsdk/src/index.js'
      - run: python scripts/vendor_core.py

  container:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform ${{ matrix.platform }} -t coach-app:test ai_running_coach
      - run: python3 scripts/smoke_container.py coach-app:test --platform ${{ matrix.platform }}
